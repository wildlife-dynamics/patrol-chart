      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "total_events"}
        - {metric: "patrol_count"}
      time_interval: "month"
      mode:
        mode: "metrics"
    trend_style:
      chart:
        chart_type: "bar"
        barmode: "stack"

category-mode:
  name: By Category (event type)
  description: >-
    Mocked IO — Break Down By "Category": total events per bucket split into
    stacked segments colored per event type display name (the patrols
    events-by-type chart). Exactly one metric row (breakdown constraint).
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "total_events"}
      time_interval: "month"
      mode:
        mode: "category"
        category: "event_type_display"
    trend_style:
      chart:
        chart_type: "bar"
        barmode: "stack"
      palette: ["#FF9600", "#F23B0E", "#A100CB", "#F04564", "#03421A", "#3089FF", "#E26FFF", "#8C1700", "#002960", "#FFD000", "#B62879", "#680078", "#005A56", "#0056C7", "#331878", "#E76826"]

spatial-mode:
  name: By Spatial Group
  description: >-
    Mocked IO — Break Down By "Spatial Group": patrol count per bucket, one
    series per region. The mock get_spatial_features_group fixture returns
    the "SpatialGrouperTest" group (Central/East/West regions) — the
    resolver keys on metadata.display_name.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "patrol_count"}
      time_interval: "month"
      mode:
        mode: "spatial"
        spatial_feature_group: "SpatialGrouperTest"

month-grouper:
  name: Month grouper
  description: >-
    Temporal Group Data grouper → one trend chart per month view. Also
    covers the patrol-day metrics (nunique of segment_start_date and the
    per-patrol-day encounter rate) on week bucketing.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers:
        - temporal_index: "%B"
    trend_config:
      metrics:
        - {metric: "patrol_days"}
        - {metric: "encounters_per_patrol_day"}
      time_interval: "week"
      mode:
        mode: "metrics"


# Test cases for patrol-trend-plot.
# All cases are mock-io (canned ER fixtures; er_asia/demo_patrol matches the
# canned patrol data, SpatialGrouperTest the canned spatial feature group).
# The `live` case (mep_dev, mock_io: false) is added in Phase 3 / publish.

base:
  name: Base
  description: Mocked IO — primary development case (no credentials needed).
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    summary_metrics:
      metrics:
        - {metric: "patrol_count"}
        - {metric: "total_distance", unit: "km"}
        - {metric: "total_events"}
    chart_mode:
      mode:
        mode: "metrics"
    trend_chart:
      time_interval: "month"
      barmode: "group"

event-sum-fields:
  name: Per-metric event fields
  description: >-
    Mocked IO — two event-sum metrics with DIFFERENT per-metric aggregate
    columns (exercises the completed set_encounter_rate_metrics
    modification). The canned patrol-events fixture has NO event_details
    numeric fields (it is pre-flattened), so this case uses the two numeric
    columns it does have: priority and serial_number. Semantically odd but
    mechanically complete. For realistic fields (e.g. number_of_snares),
    add a mock_io_overrides parquet for the unpack-events task later.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    summary_metrics:
      metrics:
        - {metric: "total_event_sum", aggregate_column: "priority"}
        - {metric: "event_sum_per_distance", unit: "km", aggregate_column: "serial_number"}
        - {metric: "total_distance", unit: "km"}
    chart_mode:
      mode:
        mode: "metrics"
    trend_chart:
      time_interval: "month"
      barmode: "group"


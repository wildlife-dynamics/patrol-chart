# Test cases for patrol-trend-plot.
# All cases are mock-io (canned ER fixtures; er_asia/demo_patrol matches the
# canned patrol data, SpatialGrouperTest the canned spatial feature group).
# The `live` case (mep_dev, mock_io: false) is added in Phase 3 / publish.
#
# Invalid combinations (multi-metric breakdowns, interval not finer than the
# Time comparison period) are covered by ecoscope unit tests — a workflow
# case would fail by design at params validation.

base:
  name: Base
  description: >-
    Mocked IO — primary development case (no credentials needed). The trend
    chart params mirror the FORM-DEFAULT submission (task defaults plus the
    rjsf-override defaults in spec.yaml): single Patrol Count metric, week
    interval, Metrics Only, grouped bars, tab20b color map, status "done".
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
      status: ["done"]
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "patrol_count"}
      time_interval: "week"
      mode:
        mode: "metrics"
    trend_style:
      chart:
        chart_type: "bar"
        barmode: "group"
      palette: "tab20b"

event-sum-fields:
  name: Per-metric event fields
  description: >-
    Mocked IO — event-sum metrics with a per-metric aggregate column. The
    canned patrol-events fixture has no event_details numeric fields, so the
    display-names task is overridden (mock_io_overrides) with a fixture that
    adds `number_of_animals` on the animal event types (Wildlife/Bird
    Sighting, Injured Animal, Human Wildlife Contact; NA on Fire and
    Poachers Camp — sums ignore NA). Two metric rows aggregate that column
    (total + per-distance rate) next to a plain total-distance row.
    trend_style omitted — exercises the style task defaults.
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_event_type_display_names_from_events: dev/fixtures/event-display-names-number-of-animals.parquet
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "total_encounter", aggregate_column: "number_of_animals"}
        - {metric: "encounters_per_distance", unit: "km", aggregate_column: "number_of_animals"}
        - {metric: "total_distance", unit: "km"}
      time_interval: "month"
      mode:
        mode: "metrics"

